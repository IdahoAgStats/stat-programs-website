theme = "starter-academic"
baseURL = "agstats.io"
#http://example.org/"
languageCode = "en-us"
title = "University of Idaho Agricultural Statistics"
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$", "\\.knit\\.md$", "\\.utf8\\.md$"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      highlight = true
      strikethrough = true
      table = true
      toc = true

[services]
  [services.googleAnalytics]
    id = 'G-ZZST40VXE1'