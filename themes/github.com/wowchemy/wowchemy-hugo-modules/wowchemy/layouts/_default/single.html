{{- define "main" -}}

<article class="article">

  {{ partial "page_header" . }}
  


  <div class="article-container">
    
      {{ if .TableOfContents }}
       <h4>Table of Contents</h4>
  <div class="table-of-contents">
    {{ .TableOfContents }}
  </div>
{{ end }}

    <div class="article-style">
      {{ .Content }}
    </div>

    {{ partial "page_footer" . }}
    
    {{ partial "newsletter_signup.html" . }}

  </div>
</article>

{{- end -}}
